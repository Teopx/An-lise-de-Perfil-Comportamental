<body><div class="shell"><header class="topbar no-print"><div class="top-inner"><div class="brand"><span class="brand-mark" aria-hidden="true">M</span><span>Mapa Comportamental</span></div><span class="top-meta">Autoconhecimento · 25 situações · cerca de 5–8 min</span></div></header><main id="app" class="container" aria-live="polite"></main></div>
<script>
(()=>{'use strict';
const questions=[
 ['Ao começar um projeto novo, eu geralmente...', ['imagino abordagens diferentes','converso com as pessoas envolvidas','defino a primeira entrega e começo','organizo etapas e critérios']],
 ['Quando aparece um problema inesperado, prefiro...', ['agir rapidamente para contê-lo','entender suas causas e organizar os dados','ouvir quem será afetado','experimentar uma solução fora do habitual']],
 ['Em uma reunião, minha contribuição mais natural é...', ['aproximar opiniões diferentes','propor possibilidades futuras','transformar a conversa em decisões','registrar detalhes e próximos passos']],
 ['Uma tarefa com prazo curto me leva a...', ['priorizar o essencial e executar','montar um plano viável','alinhar expectativas com a equipe','buscar um caminho novo para ganhar tempo']],
 ['Ao aprender algo, gosto mais de...', ['explorar ideias e fazer conexões','trocar experiências com alguém','aplicar logo em uma situação real','seguir uma sequência clara de estudo']],
 ['Se as regras de um processo mudam, tendo a...', ['revisar impactos e documentar ajustes','enxergar oportunidades na mudança','conversar sobre como todos se adaptarão','tomar a frente da implementação']],
 ['Ao receber uma meta desafiadora, eu...', ['começo a trabalhar para alcançá-la','estruturo indicadores e etapas','penso em novas maneiras de superá-la','mobilizo pessoas para colaborar']],
 ['Ao preparar uma apresentação, valorizo...', ['uma mensagem que conecte as pessoas','uma ideia original e inspiradora','uma conclusão objetiva e prática','dados bem organizados e consistentes']],
 ['Quando discordo de alguém, costumo...', ['expressar minha posição com objetividade','examinar os fatos antes de responder','buscar um diálogo que preserve a relação','abrir espaço para outra perspectiva']],
 ['Em um trabalho em equipe, sinto-me mais útil quando...', ['encontro soluções criativas','fortaleço a cooperação','impulsiono as entregas','garanto clareza e qualidade']],
 ['Diante de várias opções, normalmente...', ['decido e ajusto no caminho','comparo critérios e consequências','consulto as pessoas envolvidas','imagino o potencial de cada opção']],
 ['Um ambiente de trabalho favorável para mim tem...', ['liberdade para criar','relações de confiança','autonomia para realizar','processos claros e previsíveis']],
 ['Se um plano deixa de funcionar, prefiro...', ['investigar o desvio e corrigir o plano','redesenhar a solução','reunir o grupo para decidir junto','testar uma alternativa imediatamente']],
 ['Ao receber uma crítica, procuro primeiro...', ['entender como melhorar o resultado','identificar fatos e exemplos concretos','compreender a intenção de quem falou','avaliar outras possibilidades de atuação']],
 ['Ao distribuir responsabilidades, costumo...', ['considerar os interesses de cada pessoa','abrir espaço para novas ideias','definir responsáveis e prazos','explicitar padrões e procedimentos']],
 ['Em um dia de muitas demandas, eu...', ['resolvo primeiro o que gera mais impacto','faço uma lista e estabeleço ordem','converso para alinhar prioridades','procuro simplificar o trabalho de um jeito novo']],
 ['O que mais me anima em um projeto é...', ['criar algo que ainda não existe','construir algo em conjunto','ver resultados concretos','entregar com consistência e qualidade']],

 ['Quando uma decisão exige rapidez, eu...', ['escolho uma direção e sigo','uso os critérios disponíveis','verifico o efeito sobre as pessoas','busco uma alternativa pouco explorada']],
 ['Ao pensar no futuro, concentro-me mais em...', ['novas possibilidades','relações e colaboração','conquistas a alcançar','estabilidade e preparação']],
 ['Uma mudança bem-sucedida depende sobretudo de...', ['participação das pessoas','uma visão capaz de inspirar','execução firme','planejamento e acompanhamento']],
 ['Se encontro uma tarefa repetitiva, eu...', ['procuro concluí-la com eficiência','padronizo para evitar erros','envolvo outras pessoas para melhorar o fluxo','imagino uma forma nova de realizá-la']],
 ['Em uma conversa difícil, minha tendência é...', ['escutar e buscar entendimento','trazer novas formas de ver a situação','ir direto ao ponto e decidir','organizar fatos antes de concluir']],
 ['Ao concluir um projeto, sinto satisfação por...', ['ter transformado uma ideia em algo novo','ter colaborado com as pessoas','ter alcançado o objetivo','ter assegurado um resultado confiável']]
];
// Mapeamento separado da interface para não exibir os códigos durante o questionário.
const keys=[['I','C','A','O'],['A','O','C','I'],['C','I','A','O'],['A','O','C','I'],['I','C','A','O'],['O','I','C','A'],['A','O','I','C'],['C','I','A','O'],['A','O','C','I'],['I','C','A','O'],['A','O','C','I'],['I','C','A','O'],['O','I','C','A'],['A','O','C','I'],['C','I','A','O'],['A','O','C','I'],['I','C','A','O'],['A','O','C','I'],['O','I','C','A'],['A','O','C','I'],['I','C','A','O'],['C','I','A','O'],['A','O','C','I'],['C','I','A','O'],['I','C','A','O']];
const profiles={
 I:{name:'Águia',icon:'🦅',dimension:'Idealização e inovação',motto:'Fazer diferente',color:'#2981af',description:'Suas respostas nessa dimensão indicam inclinação para explorar possibilidades, conectar ideias e imaginar caminhos futuros.',strengths:['Criatividade e visão ampla','Curiosidade e abertura a alternativas','Capacidade de antecipar oportunidades'],attention:['Transformar ideias em etapas concretas','Acompanhar a execução até o fim','Reservar atenção aos detalhes essenciais'],motivators:['Liberdade para criar','Autonomia','Novos desafios'],decision:'Tende a considerar possibilidades e potencial futuro antes de escolher.',communication:'Costuma comunicar ideias, cenários e oportunidades.',team:'Pode contribuir com novas perspectivas e desafiar pressupostos.',change:'Em geral se interessa por novas experiências e possibilidades.',pressure:'Pode gerar muitas alternativas; definir prioridade ajuda a avançar.',environment:'Espaço para experimentar com objetivos claros.',suggestions:['Escolha uma ideia prioritária e defina o primeiro passo.','Estabeleça marcos de acompanhamento.','Convide alguém atento à execução para revisar o plano.'],perception:'Pode ser percebido como criativo e visionário; às vezes, como disperso.',talk:'Apresente possibilidades, visão e espaço para explorar.'},
 C:{name:'Gato',icon:'🐱',dimension:'Comunicação e relacionamento',motto:'Fazer junto',color:'#a263a4',description:'Suas respostas nessa dimensão indicam atenção às relações, à escuta e à construção conjunta.',strengths:['Cooperação e escuta','Facilidade de integração','Sensibilidade ao clima da equipe'],attention:['Abordar conversas difíceis com clareza','Definir limites e prioridades','Equilibrar consenso e decisão'],motivators:['Pertencimento','Reconhecimento','Colaboração'],decision:'Tende a ponderar o impacto da escolha sobre as pessoas.',communication:'Costuma buscar diálogo e entendimento mútuo.',team:'Pode aproximar pessoas e favorecer a cooperação.',change:'Pode apoiar a adaptação do grupo quando existe diálogo.',pressure:'Pode adiar um conflito; combinar critérios ajuda a decidir.',environment:'Relações de confiança e abertura para participação.',suggestions:['Pratique pedidos e devolutivas mais objetivos.','Defina o que precisa ser decidido e até quando.','Mantenha a escuta sem adiar conversas necessárias.'],perception:'Pode ser percebido como acolhedor e colaborativo; às vezes, como alguém que evita confrontos.',talk:'Valorize participação, contexto e escuta.'},
 A:{name:'Tubarão',icon:'🦈',dimension:'Ação e resultados',motto:'Fazer agora',color:'#d37043',description:'Suas respostas nessa dimensão indicam iniciativa, direção para metas e preferência por transformar decisões em entregas.',strengths:['Iniciativa e determinação','Objetividade','Capacidade de acelerar entregas'],attention:['Ouvir perspectivas antes de concluir','Considerar impactos nas pessoas','Reservar tempo para analisar riscos'],motivators:['Desafios','Autonomia','Resultados visíveis'],decision:'Tende a decidir com agilidade e ajustar o percurso conforme necessário.',communication:'Costuma ir ao ponto e propor ações claras.',team:'Pode impulsionar prazos e remover obstáculos.',change:'Pode liderar a execução quando a direção está definida.',pressure:'Pode acelerar demais; uma pausa breve para escuta melhora a escolha.',environment:'Metas claras e autonomia para realizar.',suggestions:['Antes de agir, valide os principais riscos.','Peça outra perspectiva antes de fechar decisões importantes.','Combine velocidade com pontos de controle.'],perception:'Pode ser percebido como decidido e realizador; às vezes, como impaciente.',talk:'Seja direto, apresente o objetivo e os próximos passos.'},
 O:{name:'Lobo',icon:'🐺',dimension:'Organização e controle',motto:'Fazer certo',color:'#4c7791',description:'Suas respostas nessa dimensão indicam preferência por planejamento, critérios claros e consistência.',strengths:['Planejamento e método','Atenção à qualidade','Confiabilidade e acompanhamento'],attention:['Adaptar o plano diante de novas informações','Evitar detalhamento excessivo','Decidir mesmo com alguma incerteza'],motivators:['Clareza','Segurança','Domínio técnico'],decision:'Tende a comparar informações e critérios antes de escolher.',communication:'Costuma apresentar fatos, sequência e precisão.',team:'Pode dar estrutura, continuidade e qualidade ao trabalho.',change:'Pode se adaptar melhor quando entende os motivos e o plano.',pressure:'Pode buscar mais dados que o tempo permite; critérios mínimos ajudam.',environment:'Expectativas claras e processos confiáveis.',suggestions:['Defina quando a informação já é suficiente para decidir.','Teste uma pequena mudança antes de detalhar tudo.','Reserve espaço para adaptar o plano.'],perception:'Pode ser percebido como cuidadoso e consistente; às vezes, como rígido.',talk:'Apresente fatos, critérios, prazos e organização.'}
};
const combos={
 'I-C':'Une a exploração de novas ideias à capacidade de envolver pessoas na construção delas.','I-A':'Combina visão de possibilidades com iniciativa para colocá-las em prática.','I-O':'Aproxima criatividade de estrutura, ajudando a transformar possibilidades em planos.','C-I':'Parte da conexão com pessoas e acrescenta ideias novas para mobilizar o grupo.','C-A':'Une atenção às pessoas e impulso para realizar objetivos conjuntos.','C-O':'Combina cooperação com organização e continuidade nas relações de trabalho.','A-I':'Parte da execução e acrescenta visão para encontrar caminhos alternativos.','A-C':'Combina foco em resultados com capacidade de mobilizar e ouvir pessoas.','A-O':'Une agilidade de execução à atenção a critérios e acompanhamento.','O-I':'Parte de uma base estruturada e acrescenta criatividade para revisar caminhos.','O-C':'Combina método e cuidado com a participação das pessoas.','O-A':'Une planejamento e qualidade à energia para tirar decisões do papel.'
};
const app=document.getElementById('app'); const storageKey='mapa-comportamental-v1';
let state={screen:'start',name:'',age:'',consent:false,index:0,answers:Array(25).fill(null),result:null};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(storageKey,JSON.stringify({name:state.name,age:state.age,consent:state.consent,index:state.index,answers:state.answers,result:state.result,screen:state.screen}))}catch(e){/* Armazenamento indisponível: a sessão continua. */}}
function load(){try{const x=JSON.parse(localStorage.getItem(storageKey));if(x&&Array.isArray(x.answers)&&x.answers.length===25&&x.answers.every(a=>a===null||Number.isInteger(a)&&a>=0&&a<4)){state={...state,...x};if(!['start','question','review','result'].includes(state.screen))state.screen='start';if(state.screen==='result'&&!state.result)state.screen='review'}}catch(e){}}
function render(){document.title='Mapa de Perfil Comportamental';if(state.screen==='start')renderStart();else if(state.screen==='question')renderQuestion();else if(state.screen==='review')renderReview();else renderResult();}
function renderStart(){app.innerHTML=`<div class="intro-grid"><div><p class="eyebrow">Avaliação individual</p><h1>Descubra seu perfil comportamental</h1><p class="lead">Entenda como você tende a pensar, agir, se relacionar e organizar seu trabalho. Responda 25 situações e veja a composição completa dos quatro estilos.</p><div class="profile-grid" aria-label="Dimensões do resultado">${Object.values(profiles).map(p=>`<div class="profile-mini"><span class="icon" aria-hidden="true">${p.icon}</span><span><strong>${p.name}</strong><small>${p.dimension}</small></span></div>`).join('')}</div><p class="footer-note">O resultado apresenta tendências com base nas suas escolhas. Não é diagnóstico psicológico, médico ou avaliação clínica; todos possuem características dos quatro estilos.</p></div><form id="intro-form" class="card pad"><p class="eyebrow">Comece aqui</p><h2>Sua análise</h2><p class="quiet">Leva cerca de 5 a 8 minutos.</p><div class="field"><label for="person-name">Seu nome</label><input id="person-name" name="name" maxlength="80" autocomplete="name" required value="${esc(state.name)}" placeholder="Como gostaria de ser chamado?"></div><div class="field"><label for="person-age">Sua idade</label><input id="person-age" name="age" type="number" min="1" max="120" inputmode="numeric" required value="${esc(state.age)}" placeholder="Ex.: 35"></div><label class="check-row"><input id="consent" type="checkbox" ${state.consent?'checked':''} required><span>Li e concordo com o uso das informações exclusivamente para gerar esta avaliação.</span></label><p class="privacy">Seus dados e respostas permanecem neste navegador. Eles não são enviados para um banco de dados.</p><div id="form-error" class="error" role="alert"></div><button class="btn btn-primary" type="submit">${state.answers.some(a=>a!==null)?'Continuar avaliação':'Iniciar minha análise'} <span aria-hidden="true">→</span></button></form></div>`;
 document.getElementById('intro-form').addEventListener('submit',e=>{e.preventDefault();const form=e.currentTarget;if(!form.reportValidity())return;const name=document.getElementById('person-name').value.trim(),age=Number(document.getElementById('person-age').value);if(!name||!Number.isInteger(age)||age<1||age>120){document.getElementById('form-error').textContent='Informe um nome e uma idade válida.';return}state.name=name;state.age=age;state.consent=true;state.screen='question';save();render();scrollToTop()})}
function renderQuestion(){const i=Math.max(0,Math.min(24,state.index));state.index=i;const [title,choices]=questions[i];app.innerHTML=`<div class="question-wrap"><div class="progress-meta"><span>Pergunta ${i+1} de 25</span><span>${Math.round(state.answers.filter(x=>x!==null).length/25*100)}% respondido</span></div><div class="track" role="progressbar" aria-label="Progresso da avaliação" aria-valuenow="${state.answers.filter(x=>x!==null).length}" aria-valuemin="0" aria-valuemax="25"><div class="fill" style="width:${state.answers.filter(x=>x!==null).length*4}%"></div></div><div class="card question-card"><p class="eyebrow">Escolha a opção mais próxima de você</p><h1 class="question-title" id="question-label">${esc(title)}</h1><div class="choices" role="radiogroup" aria-labelledby="question-label">${choices.map((choice,n)=>`<label class="choice ${state.answers[i]===n?'selected':''}"><input type="radio" name="answer" value="${n}" ${state.answers[i]===n?'checked':''}><span>${esc(choice)}</span></label>`).join('')}</div><div class="question-foot"><button type="button" id="back" class="btn btn-secondary">← Voltar</button><button type="button" id="next" class="btn btn-primary" ${state.answers[i]===null?'disabled':''}>${i===24?'Revisar respostas':'Continuar →'}</button></div></div><p class="quiet" style="text-align:center;margin-top:18px">Sua resposta pode ser alterada antes de finalizar.</p></div>`;
 app.querySelectorAll('input[name="answer"]').forEach(input=>input.addEventListener('change',()=>{state.answers[i]=Number(input.value);save();renderQuestion()}));document.getElementById('back').onclick=()=>{if(i===0)state.screen='start';else state.index=i-1;save();render();scrollToTop()};document.getElementById('next').onclick=()=>{if(state.answers[i]===null)return;if(i===24)state.screen='review';else state.index=i+1;save();render();scrollToTop()}}
function renderReview(){const count=state.answers.filter(a=>a!==null).length;app.innerHTML=`<div class="question-wrap card pad"><p class="eyebrow">Antes do resultado</p><h1 style="font-size:clamp(2rem,4vw,3rem)">Revise suas respostas</h1><p>${count===25?'Todas as 25 situações foram respondidas. Você pode voltar a qualquer uma delas.':`Você respondeu ${count} de 25 perguntas. Complete as ${25-count} restantes para visualizar seu resultado.`}</p><div class="review-list">${state.answers.map((a,i)=>`<button class="review-item" type="button" data-index="${i}" aria-label="Ir para pergunta ${i+1}, ${a===null?'sem resposta':'respondida'}">${i+1} ${a===null?'○':'✓'}</button>`).join('')}</div><div class="actions"><button type="button" id="review-back" class="btn btn-secondary">← Voltar</button><button type="button" id="finish" class="btn btn-primary" ${count!==25?'disabled':''}>Ver meu perfil →</button></div></div>`;app.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{state.index=Number(b.dataset.index);state.screen='question';save();render();scrollToTop()});document.getElementById('review-back').onclick=()=>{state.index=24;state.screen='question';save();render()};document.getElementById('finish').onclick=()=>{if(count!==25)return;state.result=calculate();state.screen='result';save();render();scrollToTop()}}
function calculate(){const counts={I:0,C:0,A:0,O:0};state.answers.forEach((answer,i)=>{if(answer===null)throw Error('Resposta faltante');counts[keys[i][answer]]++});const ranking=Object.keys(counts).map(key=>({key,count:counts[key],percent:counts[key]*4})).sort((a,b)=>b.count-a.count||['I','C','A','O'].indexOf(a.key)-['I','C','A','O'].indexOf(b.key));if(ranking.reduce((sum,p)=>sum+p.percent,0)!==100)throw Error('Pontuação inconsistente');return {counts,ranking,date:new Date().toLocaleDateString('pt-BR')}}
function barChart(ranking){return ranking.map(({key,percent})=>`<div class="bar-row"><span class="bar-name">${profiles[key].icon} ${profiles[key].name}</span><div class="bar-track" role="img" aria-label="${profiles[key].name}: ${percent}%"><div class="bar-fill" style="width:${percent}%;background:${profiles[key].color}"></div></div><strong>${percent}%</strong></div>`).join('')}
function radarChart(ranking){const by=Object.fromEntries(ranking.map(x=>[x.key,x.percent]));const order=['I','C','A','O'],center=150,r=105;const pts=ratio=>order.map((k,i)=>{const angle=-Math.PI/2+i*Math.PI/2;return `${(center+Math.cos(angle)*r*ratio*(by[k]/100)).toFixed(1)},${(center+Math.sin(angle)*r*ratio*(by[k]/100)).toFixed(1)}`}).join(' ');const ring=v=>order.map((_,i)=>`${(center+Math.cos(-Math.PI/2+i*Math.PI/2)*r*v).toFixed(1)},${(center+Math.sin(-Math.PI/2+i*Math.PI/2)*r*v).toFixed(1)}`).join(' ');return `<svg viewBox="0 0 300 300" role="img" aria-label="Gráfico radar: ${ranking.map(x=>profiles[x.key].name+' '+x.percent+'%').join(', ')}">${[.25,.5,.75,1].map(v=>`<polygon points="${ring(v)}" fill="none" stroke="#dbe7e8" stroke-width="1.4"/>`).join('')}<line x1="150" y1="45" x2="150" y2="255" stroke="#dbe7e8"/><line x1="45" y1="150" x2="255" y2="150" stroke="#dbe7e8"/><polygon points="${pts(1/Math.max(.4,...ranking.map(x=>x.percent/100)))}" fill="#20a595" fill-opacity=".25" stroke="#147e77" stroke-width="2.5"/><text x="150" y="21" text-anchor="middle">Águia</text><text x="274" y="154" text-anchor="middle">Gato</text><text x="150" y="288" text-anchor="middle">Tubarão</text><text x="23" y="154" text-anchor="middle">Lobo</text></svg>`}
function profileCard(item,index){const p=profiles[item.key];return `<article class="profile-detail"><span class="chip">${index===0?'Maior pontuação':index===3?'Menor pontuação':`${index+1}ª posição`} · ${item.percent}%</span><h3>${p.icon} ${p.name} — ${p.dimension}</h3><p>${p.description}</p><p><strong>Como tende a funcionar:</strong> ${p.motto.toLowerCase()}. ${p.decision}</p><p><strong>Na comunicação e no grupo:</strong> ${p.communication} ${p.team}</p><p><strong>Com mudanças e pressão:</strong> ${p.change} ${p.pressure}</p><p><strong>Ambiente favorável:</strong> ${p.environment}</p><strong>Pontos fortes</strong><ul>${p.strengths.map(x=>`<li>${x}</li>`).join('')}</ul><strong>Oportunidades de desenvolvimento</strong><ul>${p.attention.map(x=>`<li>${x}</li>`).join('')}</ul><p><strong>Motivadores:</strong> ${p.motivators.join(', ')}.</p><p><strong>Como pode ser percebido:</strong> ${p.perception}</p><p><strong>Como dialogar com esse estilo:</strong> ${p.talk}</p></article>`}
function tendency(rows){return rows.map(([label,left,right,value])=>`<div class="trend"><strong>${label}</strong><small>${esc(left)} ↔ ${esc(right)}</small><div class="trend-track"><span class="trend-dot" style="left:${Math.min(95,Math.max(5,value))}%"></span></div></div>`).join('')}
function renderResult(){if(!state.result){state.screen='start';render();return}const {ranking,date}=state.result,top=ranking[0].percent,leaders=ranking.filter(x=>x.percent===top),second=ranking.find(x=>x.percent<top),pair=leaders.length>1?leaders.slice(0,2):second?[ranking[0],second]:ranking.slice(0,2),p1=profiles[pair[0].key],p2=profiles[pair[1].key],combo=combos[pair[0].key+'-'+pair[1].key],gap=ranking[0].percent-ranking[3].percent;const scores=Object.fromEntries(ranking.map(x=>[x.key,x.percent]));const trends=[['Pensamento','Analítico','Intuitivo',50+(scores.I-scores.O)*.8],['Ação','Planejada','Imediata',50+(scores.A-scores.O)*.8],['Relacionamento','Tarefa','Pessoas',50+(scores.C-scores.A)*.8],['Mudança','Estabilidade','Inovação',50+(scores.I-scores.O)*.8]];const names=leaders.map(x=>profiles[x.key].name).join(' + '),duo=leaders.length>1;app.innerHTML=`<div class="report-head"><div><p class="eyebrow">Relatório individual · ${esc(date)}</p><h1>${esc(state.name)}, este é seu mapa</h1><p class="quiet">${esc(state.age)} anos · 25 respostas · quatro tendências</p></div><div class="actions no-print"><button id="print" class="btn btn-primary" type="button">Imprimir / salvar PDF</button><button id="restart" class="btn btn-outline" type="button">Refazer avaliação</button></div></div><div class="result-hero"><div><p class="eyebrow" style="color:#71e0c7">${duo?'Dupla predominância':'Perfil com maior pontuação'}</p><h2>${esc(names)} · ${top}%</h2><p>${duo?'Dois ou mais estilos tiveram a maior pontuação. O empate foi mantido no resultado.':p1.description}</p></div><div class="result-symbol" aria-hidden="true">${p1.icon}</div></div><section class="section card pad"><h2>Sua composição comportamental</h2><div class="score-grid"><div><h3>Percentuais</h3>${barChart(ranking)}<table class="ranking"><thead><tr><th>Posição</th><th>Perfil</th><th>Respostas</th><th>Percentual</th></tr></thead><tbody>${ranking.map((x,i)=>`<tr><td>${i>0&&x.percent===ranking[i-1].percent?'Empate':`${i+1}º`}</td><td>${profiles[x.key].name}</td><td>${x.count}</td><td>${x.percent}%</td></tr>`).join('')}</tbody></table></div><div class="radar-frame">${radarChart(ranking)}</div></div><p class="quiet">Cada resposta corresponde a 4 pontos percentuais. A soma dos quatro perfis é 100%.</p></section><section class="section card pad"><p class="eyebrow">Resumo executivo</p><h2>${duo?'Dois estilos à frente':'Sua combinação principal'}</h2><p>As respostas de ${esc(state.name)} indicam ${duo?`pontuação igualmente alta em ${esc(names)}`:`maior pontuação em ${p1.name} (${top}%), seguida por ${p2.name} (${pair[1].percent}%)`}. ${combo} Os demais estilos também fazem parte do seu repertório e podem surgir de acordo com a situação.</p>${leaders.length>2?`<p class="quiet">Há ${leaders.length} perfis empatados na maior pontuação; a descrição da dupla exemplifica duas dessas dimensões, sem estabelecer prioridade entre elas.</p>`:''}<p><strong>Distribuição:</strong> ${gap<=12?'Os quatro percentuais estão relativamente próximos. Você apresenta uma distribuição mais equilibrada entre os estilos.':'Há uma diferença mais marcada entre a maior e a menor pontuação, sugerindo uma preferência mais frequente nas situações apresentadas.'}</p></section><section class="section"><h2>Análise dos quatro perfis</h2><p class="quiet">Menor pontuação não significa deficiência. Ela indica apenas que certas respostas apareceram menos vezes neste questionário.</p><div class="two-col">${ranking.map(profileCard).join('')}</div></section><section class="section card pad"><h2>Seu mapa de tendências</h2><p class="quiet">Leitura exploratória construída a partir dos quatro percentuais. Estes eixos não foram validados como medidas psicológicas independentes.</p>${tendency(trends)}</section><section class="section card pad"><h2>Como ampliar seu repertório</h2><ul class="suggestions">${[...new Set([...profiles[ranking[0].key].suggestions,...profiles[pair[1].key].suggestions])].slice(0,6).map(x=>`<li>${x}</li>`).join('')}</ul><p class="footer-note">Esta avaliação expressa tendências com base nas respostas dadas hoje. Não constitui diagnóstico psicológico, médico ou avaliação clínica. Nenhum perfil é melhor ou pior que outro.</p></section><div class="actions no-print"><button id="print-bottom" class="btn btn-primary" type="button">Imprimir / salvar PDF</button><button id="restart-bottom" class="btn btn-outline" type="button">Refazer avaliação</button></div>`;for(const id of ['print','print-bottom'])document.getElementById(id).onclick=()=>window.print();for(const id of ['restart','restart-bottom'])document.getElementById(id).onclick=()=>{if(confirm('Deseja apagar as respostas deste navegador e iniciar uma nova avaliação?')){localStorage.removeItem(storageKey);state={screen:'start',name:'',age:'',consent:false,index:0,answers:Array(25).fill(null),result:null};render();scrollToTop()}}}
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'})}load();render();
})();
</script></body></html>
